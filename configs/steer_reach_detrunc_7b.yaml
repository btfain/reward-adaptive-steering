# JOB B — steering reachability probe on the DETRUNCATED pool (does the per-prompt free-δ +0.49
# survive when completeness is no longer the reward signal, i.e. does steering move the QUALITY axis?).
# Reuses Job A's pool (results/prompt_basis_detrunc_7b/pool.jsonl). Same prompts/RM as the prompt-basis
# run => apples-to-apples steering-vs-prompting on a valid reward. Run AFTER Job A finishes.
# python src/steer_reach.py --base-config configs/base_7b.yaml --config configs/steer_reach_detrunc_7b.yaml

tag: "detrunc_7b"
pool_dir: "results/prompt_basis_detrunc_7b"     # Job A's detruncated base pool

mag_fracs: [0.05, 0.10]

reward:
  beta: 1.0

read_layer: 18

inner:
  steps: 40
  lr: 0.05
  mag_penalty: 0.1

pool:
  n_prompts_train: 120                            # match Job A's pool
  n_prompts_test: 50
  n_samples: 6
  max_new_tokens: 256                             # detruncated, matches Job A
  temperature: 0.9
  top_p: 0.95

eval:
  n_samples: 4
  guard_prompts: 20

factor:
  cap_frac: 0.10
  n_pca: 40
  ridge: 1.0

optim:
  seed: 0

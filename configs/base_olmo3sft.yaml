# Base config for the 2b un-aligned-model arm: OLMo-3-7B at the SFT-only stage (instruction-tuned but NOT
# preference/safety-tuned). Same 7B scale as Qwen2.5-7B-Instruct -> isolates ALIGNMENT, not size. Used only
# as the GENERATOR (load_base) for synth_swing / mt_swing; reward comes from the deterministic scorer or the
# Prometheus judge, not the RM fields below. NOTE: OLMo 3 requires transformers >= 4.57.0.
tag: "olmo3sft"

base_model: allenai/Olmo-3-7B-Instruct-SFT
reward_model: Skywork/Skywork-Reward-V2-Qwen3-0.6B
reward_model_alt: Skywork/Skywork-Reward-V2-Llama-3.2-1B

device: auto
dtype: auto

steer_layer: 18            # unused by synth_swing/mt_swing (they generate without a steering hook)
capture_layers: [14, 18, 22]

generation:
  max_new_tokens: 512
  do_sample: true
  temperature: 0.7
  top_p: 0.9

data:
  prompt_dataset: HuggingFaceH4/ultrafeedback_binarized
  prompt_split: train_prefs
  prompt_field: prompt

seed: 0

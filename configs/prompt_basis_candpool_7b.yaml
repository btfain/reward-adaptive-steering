# P1(i)/(ii) REFERENCE matrix — deliberately a SMALL prompt subsample over a LARGE candidate pool. This
# full N×C matrix is ONLY ground truth for evaluation, NOT the pipeline: (ii)'s cost-aware selection is
# validated by showing it recovers this greedy basis while QUERYING FAR FEWER cells; (i) compares
# auto-vs-curated-vs-combined basis value on it. So: few prompts (64), full large pool (~120 candidates),
# low m. Reuses prompt_basis.py unchanged. PREREQ: gen_candidates.py wrote candidates_combined_7b.txt.

tag: "candpool_7b"
pool_dir: "results/prompt_basis_candpool_7b"
candidates_file: "configs/candidates_combined_7b.txt"     # auto (first n_auto rows) + curated
prompts_split: "train_large"

select:
  K: 16                                                    # see the full value-vs-K curve on the large pool

router:
  read_layers: [18]
  n_pca: 40
  arms: [linear]
  mlp_hidden: 128
  epochs: 300
  lr: 0.05
  weight_decay: 0.001

pool:
  n_prompts_train: 64                                     # SMALL prompt subsample — this matrix is eval-only
  n_prompts_test: 32                                       # held-out for downstream basis evaluation
  m_base: 2
  m_swing: 2
  max_new_tokens: 768
  temperature: 0.9
  top_p: 0.95

eval:
  m_test: 12

optim:
  seed: 0
